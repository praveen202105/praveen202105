<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Praveen Gupta — Full-Stack Developer</title>
  <desc id="desc">A dark blue and violet developer profile banner with subtle code-inspired decoration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102a56"/>
      <stop offset="1" stop-color="#32116b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".28"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="170" cy="78" r="210" fill="url(#glow)"/>
  <circle cx="1060" cy="310" r="250" fill="url(#glow)"/>

  <g opacity=".52" fill="none" stroke="url(#accent)" stroke-width="3">
    <path d="M70 103 30 140l40 37"/>
    <path d="m1130 183 40 37-40 37"/>
    <path d="m108 205 34-92"/>
    <path d="m1092 275-34-92"/>
  </g>

  <g filter="url(#shadow)" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="600" y="145" fill="#ffffff" font-size="68" font-weight="750" letter-spacing="1">Praveen Gupta</text>
    <rect x="359" y="174" width="482" height="4" rx="2" fill="url(#accent)"/>
    <text x="600" y="225" fill="#cbd5e1" font-size="28" font-weight="500" letter-spacing="3">FULL-STACK DEVELOPER</text>
    <text x="600" y="274" fill="#93c5fd" font-size="20" font-weight="500" letter-spacing="1.5">REAL-TIME WEB APPS  •  AI-ASSISTED PRODUCTS</text>
  </g>

  <g fill="#ffffff" opacity=".12">
    <circle cx="220" cy="296" r="4"/>
    <circle cx="251" cy="296" r="4"/>
    <circle cx="282" cy="296" r="4"/>
    <circle cx="918" cy="64" r="4"/>
    <circle cx="949" cy="64" r="4"/>
    <circle cx="980" cy="64" r="4"/>
  </g>
</svg>
